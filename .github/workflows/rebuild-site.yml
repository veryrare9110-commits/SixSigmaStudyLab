name: Rebuild site

on:
  push:
    paths:
      - 'payload/**'
      - '.github/workflows/rebuild-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild site files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          for stem, output in [('index_html', 'index.html'), ('app_js', 'app.js')]:
              parts = sorted(Path('payload').glob(f'{stem}_*.txt'))
              if not parts:
                  raise SystemExit(f'No payload chunks found for {stem}')
              data = ''.join(p.read_text().strip() for p in parts)
              Path(output).write_bytes(gzip.decompress(base64.b64decode(data)))
              print(f'Rebuilt {output} from {len(parts)} chunks')
          PY

      - name: Validate reconstructed files
        run: |
          test -s index.html
          test -s app.js
          grep -q 'Six Sigma Study Lab' index.html
          grep -q 'SUPPORT_PAYMENT_URL' app.js

      - name: Commit rebuilt site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js
          git diff --cached --quiet || git commit -m 'Rebuild site files'
          git push

# Payload chunks verified against the local source before this run.
